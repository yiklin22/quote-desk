[project]
name = "quote-desk"
version = "0.1.0"
description = "Enquiry-to-quote assistant for a cleaning business: code prices, a person approves, nothing sends itself"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.5",
    "jinja2>=3.1.6",
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pdfminer-six>=20260107",
    "pytest>=9.2.0",
]
